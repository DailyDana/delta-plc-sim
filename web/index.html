<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delta PLC Simülatör</title>
    <meta name="description" content="Tarayıcıda çalışan Delta DVP ladder simülatörü: devre kur, IL yaz, çalıştır, izle." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23383E42'/%3E%3Cpath d='M6 16h7M19 16h7M13 9v14M19 9v14' stroke='%233DD68C' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
    <script>
      // Tema, ilk çizimden önce uygulanır (yanıp sönme olmasın). Depolama kapalıysa sessizce geçilir.
      try {
        var s = JSON.parse(localStorage.getItem('dps2.settings') || '{}');
        var t = s.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Bu simülatör JavaScript gerektirir.</noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
